# Whole stack. Each service lives in manifests/<svc>/compose.yml; this file only includes them.
# `name:` in included files is ignored: every container belongs to project butler-iac.
# Needs --env-file ~/.config/butler-iac/stack.env (rendered by the butler Ansible role).
name: butler-iac

include:
  - manifests/9router/compose.yml
  - manifests/headroom/compose.yml
  - manifests/hermes/compose.yml
  - manifests/paseo/compose.yml
  - manifests/butler/compose.yml
  - manifests/node-exporter/compose.yml
  - manifests/cadvisor/compose.yml
  - manifests/blackbox/compose.yml
  - manifests/prometheus/compose.yml
  - manifests/grafana/compose.yml

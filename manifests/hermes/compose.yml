# Gateway joins the project default network (butler_default, named in manifests/butler) to reach the Butler API for librarian runs.
name: hermes
x-hermes: &hermes
  image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784 # :latest manifest list, resolved 2026-10-10
  restart: unless-stopped
  volumes:
    # Bind mount of existing state; image HERMES_HOME=/opt/data.
    - /home/agentops/.hermes:/opt/data
  environment:
    # ponytail: assumes entrypoint honors HERMES_UID/GID; not verified. Match host user hermes (1003).
    - HERMES_UID=1003
    - HERMES_GID=1003
    - API_SERVER_ENABLED=true
    # Gateway API listens only on its address in the private hermes-api network (not 0.0.0.0, which would also open it on butler_default).
    # Only the gateway and hermes-webui are on that network; the dashboard runs no API server.
    - API_SERVER_HOST=172.30.60.2
    # Write-safe roots (os.pathsep-separated). Keep /opt/data (profiles, skills, notes); repos lets agents edit AGENTS.md etc. in the clones.
    - HERMES_WRITE_SAFE_ROOT=/opt/data:/home/agentops/workspace/repos
    - API_SERVER_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in .env}
    # Same for Hermes (HOME=/opt/data) and omp (HOME=/home/paseo); no per-HOME ~/.ssh needed.
    - GIT_SSH_COMMAND=ssh -i /home/paseo/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/paseo/.ssh/known_hosts
    # Commit identity for agent commits (distinct from the administrator's, so history shows what the agents wrote).
    - GIT_AUTHOR_NAME=Butler Agent
    - GIT_AUTHOR_EMAIL=butler@williamwibowo.com
    - GIT_COMMITTER_NAME=Butler Agent
    - GIT_COMMITTER_EMAIL=butler@williamwibowo.com
    # Lark bot (Hermes feishu adapter, websocket mode: no public URL needed). Empty = adapter stays off.
    - FEISHU_APP_ID=${FEISHU_APP_ID:-}
    - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    - FEISHU_DOMAIN=lark
    - FEISHU_CONNECTION_MODE=websocket

services:
  gateway:
    <<: *hermes
    container_name: hermes-gateway
    command: ["gateway", "run"]
    healthcheck:
      # ponytail: python from image venv, curl presence unverified.
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://172.30.60.2:8642/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 8642 stays unpublished and is reachable only over hermes-api (gateway + webui); the API key still guards it.
    networks:
      default:
      hermes-api:
        ipv4_address: 172.30.60.2
    volumes:
      - /home/agentops/.hermes:/opt/data
      # Butler wiki + task DB for scripts/butler-review-queue.sh (librarian runs inside this container).
      - /home/agentops/data/butler:/var/lib/butler
      # /var/lib/butler/wiki is a symlink to WIKI_DIR; mount the target at the same path so it resolves.
      - ${WIKI_DIR:?WIKI_DIR is required}:${WIKI_DIR:?WIKI_DIR is required}
      # Researcher output path referenced by wiki SCHEMA.md (raw/briefings/).
      - /home/agentops/workspace/research:/home/agentops/workspace/research
      # Dedicated workspace: persistent clones of working repos (e.g. butler-backend).
      - /home/agentops/workspace/repos:/home/agentops/workspace/repos
      # omp delegation: same binary/state paths as the paseo container, so run it as `HOME=/home/paseo /opt/omp/bin/omp -p ...`.
      - /opt/omp:/opt/omp:ro
      - /home/agentops/.omp:/home/paseo/.omp
      - /home/agentops/.pi:/home/paseo/.pi
      - /home/agentops/.agents:/home/paseo/.agents:ro
      # GitHub SSH identity (the administrator's key, by choice): read-only; git finds it through GIT_SSH_COMMAND below.
      - /home/agentops/.ssh:/home/paseo/.ssh:ro
  dashboard:
    <<: *hermes
    container_name: hermes-dashboard
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--insecure", "--tui", "--no-open"]
    # Dashboard --tui runs agent sessions here: needs the same workspace mounts as the gateway (a service-level volumes key replaces the anchor's).
    volumes:
      - /home/agentops/data/butler:/var/lib/butler
      - /home/agentops/.hermes:/opt/data
      - ${WIKI_DIR:?WIKI_DIR is required}:${WIKI_DIR:?WIKI_DIR is required}
      - /home/agentops/workspace/research:/home/agentops/workspace/research
      - /home/agentops/workspace/repos:/home/agentops/workspace/repos
      # omp delegation: same binary/state paths as the paseo container, so run it as `HOME=/home/paseo /opt/omp/bin/omp -p ...`.
      - /opt/omp:/opt/omp:ro
      - /home/agentops/.omp:/home/paseo/.omp
      - /home/agentops/.pi:/home/paseo/.pi
      - /home/agentops/.agents:/home/paseo/.agents:ro
      # GitHub SSH identity (the administrator's key, by choice): read-only; git finds it through GIT_SSH_COMMAND below.
      - /home/agentops/.ssh:/home/paseo/.ssh:ro
    ports:
      # Tailscale IP only; Docker-published ports bypass UFW.
      - "${TAILSCALE_IP:?set TAILSCALE_IP}:9119:9119"

  # hermes-webui (browser/Hermex Android client). Runs the agent in-process, so it needs the agent source of the SAME pinned
  # digest as the gateway/dashboard (version-coupled upstream). agent-src refreshes the named volume from the pinned image on every `up`
  # (chmod: some image files are root-only, and the WebUI user (uid 1003) must read the whole tree).
  agent-src:
    <<: *hermes
    container_name: hermes-agent-src
    restart: "no"
    entrypoint: ["sh", "-c", "find /dst -mindepth 1 -delete && cp -a /opt/hermes/. /dst/ && chmod -R a+rX /dst"]
    command: []
    environment: []
    volumes:
      - hermes-agent-src:/dst
  webui:
    # ghcr.io/nesquena/hermes-webui v0.52.462 (:latest resolved 2026-10-12); repin together with the agent digest above.
    image: ghcr.io/nesquena/hermes-webui@sha256:9935e8c525249383267d104dccb3f974beaacd243c52862957d3d470b2dc103f
    container_name: hermes-webui
    restart: unless-stopped
    depends_on:
      agent-src:
        condition: service_completed_successfully
    ports:
      # Loopback only; exposed to the tailnet by Caddy (chat.williamwibowo.com). Docker-published ports bypass UFW.
      - "127.0.0.1:8787:8787"
    environment:
      - WANTED_UID=1003
      - WANTED_GID=1003
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      # ponytail: workaround for upstream nesquena/hermes-webui#8113 (image venv is py3.12, the agent gates its core deps on py>=3.14).
      # Drop once the WebUI image creates a 3.14 venv itself. Recreating the container is what rebuilds the venv.
      - UV_PYTHON=3.14
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:?set HERMES_WEBUI_PASSWORD in .env}
      # Tasks/cron health probe against the gateway API (8642 stays unpublished).
      - HERMES_API_URL=http://172.30.60.2:8642
      # Run browser chat turns on the gateway (same mounts/env/tools as the dashboard) instead of in-process in this container.
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in .env}
    volumes:
      - /home/agentops/.hermes:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      # Butler task DB (tasks.py default path) so WebUI agents can manage tasks. The wiki stays unmounted (librarian-only writes).
      - /home/agentops/data/butler:/var/lib/butler
      - /home/agentops/workspace/repos:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [default, hermes-api]

volumes:
  hermes-agent-src:

networks:
  hermes-api:
    # Private link between the gateway API (:8642) and hermes-webui's gateway chat backend. Keep other services off it.
    ipam:
      config:
        - subnet: 172.30.60.0/24

global:
  scrape_interval: 30s
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  # HTTP probes through blackbox-exporter, one entry per service. `service` is the friendly name dashboards show.
  # Only containers on the project network are reachable: Caddy, Paseo (host netns) and 9router/headroom
  # (app-network) are not, so their availability comes from cAdvisor (container running) instead.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://hermes-webui:8787/health"]
        labels: { service: hermes-webui }
      - targets: ["http://grafana:3000/api/health"]
        labels: { service: grafana }
      - targets: ["http://prometheus:9090/-/healthy"]
        labels: { service: prometheus }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-alive
    metrics_path: /probe
    params:
      module: [http_alive]
    static_configs:
      - targets: ["http://hermes-dashboard:9119/"]
        labels: { service: hermes-dashboard }
      - targets: ["http://backend:8765/healthz"]
        labels: { service: butler-api }
      - targets: ["http://frontend:3100/"]
        labels: { service: butler-ui }
    relabel_configs: *blackbox_relabel

name: butler

# Digests bumped by CI (.github/workflows/bump-digest.yml, scripts/bump-digest.sh). Images private on GHCR: `docker login ghcr.io` (read:packages) as ubuntu.
# Needs BUTLER_* + WIKI_DIR in the environment (see gitops-pull-apply.sh).
services:
  backend:
    image: ghcr.io/william-dwe/butler-backend@sha256:0edcf532f3b1de1b48d0a477a5466fee1d2c2535d38abfcd4aa8cf6e9c983cb3
    restart: unless-stopped
    user: "0:0"
    environment:
      BUTLER_BIND: "0.0.0.0"
      BUTLER_DATA: /data
      BUTLER_LOGIN: ${BUTLER_LOGIN:?BUTLER_LOGIN required}
      BUTLER_ORIGIN: ${BUTLER_ORIGIN:?BUTLER_ORIGIN is required}
      BUTLER_WEB_ORIGIN: ${BUTLER_WEB_ORIGIN:?BUTLER_WEB_ORIGIN is required}
      BUTLER_ICAL_URL: ${BUTLER_ICAL_URL:-}
      BUTLER_9ROUTER_URL: http://9router:20128
      BUTLER_9ROUTER_TOKEN: ${BUTLER_9ROUTER_TOKEN:-}
      BUTLER_LIBRARIAN_TOKEN_SHA256: ${BUTLER_LIBRARIAN_TOKEN_SHA256:-}
      BUTLER_LLM_BASE_URL: http://9router:20128/v1
      BUTLER_LLM_API_KEY: ${BUTLER_LLM_API_KEY:-}
      BUTLER_LLM_MODEL: ${BUTLER_LLM_MODEL:-}
    ports:
      - 127.0.0.1:8765:8765
    volumes:
      - /home/agentops/data/butler:/data
      - type: bind
        source: ${WIKI_DIR:?WIKI_DIR is required}
        target: ${WIKI_DIR:?WIKI_DIR is required}
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - app-network

  frontend:
    image: ghcr.io/william-dwe/butler-frontend@sha256:83a7bff0bc94a3730f0f4a9f1a59bf7cc633c9fdd9f41b39e63961c3f5b9b550
    restart: unless-stopped
    environment:
      BUTLER_API: http://backend:8765
      BUTLER_LOGIN: ${BUTLER_LOGIN:?BUTLER_LOGIN is required}
      BUTLER_ORIGIN: ${BUTLER_ORIGIN:?BUTLER_ORIGIN is required}
      BUTLER_WEB_ORIGIN: ${BUTLER_WEB_ORIGIN:?BUTLER_WEB_ORIGIN is required}
    ports:
      - 127.0.0.1:3100:3100

networks:
  # Shared with hermes-gateway (scripts/butler-review-queue.sh curls backend:8765). Name kept from the old standalone project.
  default:
    name: butler_default
  app-network: {}

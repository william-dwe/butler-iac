- name: Start personal-agent services
  hosts: all
  become: true
  roles:
    # Whole stack (9router, headroom, hermes, paseo, butler, monitoring): root docker-compose.yml,
    # applied by gitops-pull-apply (needs ~ubuntu/.config/butler-iac/stack.env from the butler role).
    - role: butler
      tags: [butler-deploy]
      when: "'butler-deploy' in ansible_run_tags"
    # Host setup only (user, config seed); containers come from the root compose.
    # Cutover-only: the bare-systemd units on :9119/:6767 must be stopped first.
    - role: hermes
      tags: [hermes, never]
    - role: paseo
      tags: [paseo, never]
    # Daily encrypted restic backup of /home/agentops state (scripts/backup.sh).
    - role: backup
      tags: [backup]

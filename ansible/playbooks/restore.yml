- name: Restore personal-agent state
  hosts: all
  become: true

  tasks:
    - name: Require local backup archive
      ansible.builtin.assert:
        that:
          - backup_file is defined
          - backup_file is file
        fail_msg: "Pass -e backup_file=backups/<name>.tar.zst (path relative to ansible/)"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check Docker prerequisite
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Require initialization prerequisites
      ansible.builtin.assert:
        that:
          - docker_bin.stat.exists
        fail_msg: "Run playbooks/init.yml on this host first (Hermes runs as Compose; its state comes from the archive)"

    - name: Upload state archive
      ansible.builtin.copy:
        src: "{{ backup_file | realpath }}"
        dest: /var/tmp/pai-restore.tar.zst
        mode: "0600"
      become: false

    - name: Stop and restore state
      block:
        - name: Stop services
          ansible.builtin.import_tasks: tasks/stop_services.yml

        - name: List archive members
          ansible.builtin.command: tar --zstd -tf /var/tmp/pai-restore.tar.zst
          register: archive_members
          changed_when: false

        - name: Remove fresh 9router data (only where the archive carries a replacement)
          ansible.builtin.file:
            path: "{{ item }}/9router"
            state: absent
          loop: "{{ router_data_dirs }}"
          when: (item | regex_replace('^/', '') ~ '/9router/') in archive_members.stdout_lines

        - name: Extract state archive
          ansible.builtin.command: tar --zstd --acls -xpf /var/tmp/pai-restore.tar.zst -C /
      always:
        - name: Resume services
          ansible.builtin.import_tasks: tasks/start_services.yml
        - name: Remove uploaded archive
          ansible.builtin.file:
            path: /var/tmp/pai-restore.tar.zst
            state: absent

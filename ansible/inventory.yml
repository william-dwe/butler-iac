# Local run on VPS. Remote: ansible-playbook -i '<host>,' -u ubuntu <playbook>
all:
  vars:
    admin_user: ubuntu
    agent_user: agentops
    dashboard_user: agentops
    infra_repo_url: https://github.com/william-dwe/butler-iac.git
    infra_dir: "/home/{{ admin_user }}/services/butler-iac"
    # Compose bind-mount root holding ./data/9router.
    router_data_dirs:
      - "{{ infra_dir }}/data"
    # Control plane (admin user's home, outside the agents' home). keys + runtime.env are root-owned 0600; stack.env is ubuntu 0600.
    control_dir: "/home/{{ admin_user }}/.config/butler-iac"
    runtime_env: "{{ control_dir }}/runtime.env"
    dotenvx_key_path: "{{ control_dir }}/dotenvx.keys"
    butler_repo_url: git@github.com:william-dwe/butler.git
    butler_dir: "/home/{{ agent_user }}/services/butler"
    butler_deploy_ref: main
    wiki_repo_url: https://github.com/william-dwe/second-brain-wiki.git
    wiki_dir: "/home/{{ agent_user }}/services/second-brain-wiki"
  children:
    vps:
      hosts:
        localhost:
          ansible_connection: local

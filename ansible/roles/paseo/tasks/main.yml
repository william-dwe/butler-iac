- name: Create Paseo home
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.paseo"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0700"

- name: Create Paseo CLI exposure dir
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.paseo/local-bin"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Seed Paseo config (loopback; Caddy is the way in)
  ansible.builtin.copy:
    dest: "/home/{{ agent_user }}/.paseo/config.json"
    content: "{{ {'version': 1, 'daemon': {'listen': '127.0.0.1:6767', 'relay': {'enabled': false}}, 'features': {'webUi': {'enabled': true}}} | to_nice_json }}\n"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0600"
    force: false
    # ponytail: seed only; live config.json has hand-edited profiles/plugins. PASEO_LISTEN in compose wins over daemon.listen.


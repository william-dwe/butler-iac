- name: Clone infrastructure repository
  ansible.builtin.git:
    repo: "{{ infra_repo_url }}"
    dest: "{{ infra_dir }}"
    update: false
  become_user: "{{ admin_user }}"

- name: Create deploy manifests directory
  ansible.builtin.file:
    path: "{{ deploy_manifests_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Clone butler-iac manifest repository
  ansible.builtin.git:
    repo: "{{ butler_iac_repo_url }}"
    dest: "{{ deploy_manifests_dir }}/butler-iac"
    version: "{{ butler_iac_version }}"
    update: true
  become_user: "{{ admin_user }}"

# ubuntu (docker group) pulls and applies; units are linked from this checkout.
- name: Link GitOps pull-apply units
  ansible.builtin.file:
    src: "{{ infra_dir }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    state: link
    force: true
  loop:
    - gitops-pull-apply.service
    - gitops-pull-apply.timer
  register: gitops_units

- name: Enable GitOps pull-apply timer
  ansible.builtin.systemd:
    name: gitops-pull-apply.timer
    enabled: true
    state: started
    daemon_reload: "{{ gitops_units.changed }}"

- name: Clone infrastructure repository
  ansible.builtin.git:
    repo: "{{ infra_repo_url }}"
    dest: "{{ infra_dir }}"
    update: false
  become_user: "{{ admin_user }}"

# ubuntu (docker group) pulls this checkout and applies manifests/; units are linked from it.
- name: Link GitOps pull-apply units
  ansible.builtin.file:
    src: "{{ infra_dir }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    state: link
    force: true
  loop:
    - gitops-pull-apply.service
    - gitops-pull-notify.service
    - gitops-pull-apply.timer
  register: gitops_units

- name: Enable GitOps pull-apply timer
  ansible.builtin.systemd:
    name: gitops-pull-apply.timer
    enabled: true
    state: started
    daemon_reload: "{{ gitops_units.changed }}"

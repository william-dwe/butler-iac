# Daily encrypted restic backup of agent state (scripts/backup.sh). Default repository is local; for off-box put
# RESTIC_REPOSITORY + credentials in {{ control_dir }}/backup.env (root 0600). See README "Backups".
- name: Install restic and rclone
  ansible.builtin.apt:
    name:
      - restic
      - rclone
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [backup]

- name: Create control-plane configuration directory
  ansible.builtin.file:
    path: "{{ control_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  tags: [backup]

- name: Create local backup repository directory
  ansible.builtin.file:
    path: "{{ backup_local_repo_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [backup]

# Preferred: the restic password lives in Ansible Vault (vault_backup_password), like the dotenvx key, so it survives
# loss of this host. Fallback: generated once on the host (then copy it into the vault; see README "Backups").
- name: Install restic repository password from the vault
  ansible.builtin.copy:
    content: "{{ vault_backup_password }}"
    dest: "{{ control_dir }}/backup.pass"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: vault_backup_password is defined
  tags: [backup]

- name: Generate restic repository password (no vault value defined)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      head -c 32 /dev/urandom | base64 > {{ (control_dir ~ '/backup.pass') | quote }}
    executable: /bin/bash
    creates: "{{ control_dir }}/backup.pass"
  register: backup_pass
  when: vault_backup_password is not defined
  tags: [backup]

- name: Restrict restic password file
  ansible.builtin.file:
    path: "{{ control_dir }}/backup.pass"
    owner: root
    group: root
    mode: "0600"
  when: vault_backup_password is defined or not (ansible_check_mode and backup_pass.changed)
  tags: [backup]

- name: Remind to put the generated restic password into the vault
  ansible.builtin.debug:
    msg: >-
      The restic password at {{ control_dir }}/backup.pass exists only on this host. Add it to Ansible Vault as
      vault_backup_password (README "Backups") so backups stay readable if the host is lost.
  when: vault_backup_password is not defined
  tags: [backup]

# Off-box copy to Google Drive through rclone. Values live in Ansible Vault; without all three the backup stays
# local-only. Scope drive.file: the token can only see files this backup created, not the rest of the Drive.
- name: Render rclone config for Google Drive
  ansible.builtin.copy:
    content: |
      [gdrive]
      type = drive
      client_id = {{ vault_gdrive_client_id }}
      client_secret = {{ vault_gdrive_client_secret }}
      scope = drive.file
      token = {{ vault_gdrive_token }}
    dest: "{{ control_dir }}/rclone.conf"
    owner: root
    group: root
    mode: "0600"
    force: false  # create only: rclone and scripts/gdrive-relogin.sh keep the live token here
  no_log: true
  when:
    - vault_gdrive_client_id is defined
    - vault_gdrive_client_secret is defined
    - vault_gdrive_token is defined
  register: backup_rclone_conf
  tags: [backup]

# rclone refreshes the token inside rclone.conf itself and gdrive-relogin.sh replaces it after a revoke, so the vault
# copy only seeds the file (force: false). Without vault values, run `sudo scripts/gdrive-relogin.sh --setup`.
- name: Render off-box backup settings (Google Drive)
  ansible.builtin.copy:
    content: |
      REMOTE_RESTIC_REPOSITORY=rclone:gdrive:agent-state
      RCLONE_CONFIG={{ control_dir }}/rclone.conf
      RCLONE_DRIVE_USE_TRASH=false
    dest: "{{ control_dir }}/backup.env"
    owner: root
    group: root
    mode: "0600"
  when: backup_rclone_conf is not skipped
  tags: [backup]

- name: Link backup units
  ansible.builtin.file:
    src: "{{ infra_dir }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    state: link
    force: true
  loop:
    - backup.service
    - backup-notify.service
    - backup.timer
  register: backup_units
  tags: [backup]

- name: Enable backup timer
  ansible.builtin.systemd:
    name: backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ backup_units.changed }}"
  when: not ansible_check_mode
  tags: [backup]

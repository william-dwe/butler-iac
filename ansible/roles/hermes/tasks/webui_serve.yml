# Tailnet-only HTTPS :443 -> hermes-webui on loopback (Hermex Android client). Never Funnel.
- name: Read Tailscale Serve configuration
  ansible.builtin.command: tailscale serve status
  register: hermes_serve_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse to overwrite an existing HTTPS :443 Serve route
  ansible.builtin.assert:
    that: hermes_serve_status.stdout is not search('(?m)^https://[^:\s]+\s')
    fail_msg: "Serve already has an HTTPS :443 route that is not {{ hermes_webui_serve_target }}; resolve it manually."
  when: hermes_webui_serve_target not in hermes_serve_status.stdout

- name: Configure hermes-webui Tailscale Serve
  ansible.builtin.command: "tailscale serve --bg --https=443 {{ hermes_webui_serve_target }}"
  when: hermes_webui_serve_target not in hermes_serve_status.stdout

- name: Create Butler data directory
  ansible.builtin.file:
    path: "{{ butler_data_dir }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "{{ butler_data_mode }}"
  tags: [butler, butler-deploy]

- name: Set Butler data ACLs
  ansible.posix.acl:
    path: "{{ butler_data_dir }}"
    etype: "{{ item.etype }}"
    entity: "{{ item.entity }}"
    permissions: "{{ item.permissions }}"
    default: "{{ item.default }}"
    state: present
  loop:
    - { etype: user, entity: "{{ admin_user }}", permissions: rwx, default: false }
    - { etype: user, entity: "{{ agent_user }}", permissions: rwx, default: true }
    - { etype: user, entity: "{{ admin_user }}", permissions: rwx, default: true }
    - { etype: group, entity: "", permissions: "---", default: true }
    - { etype: other, entity: "", permissions: "---", default: true }
  tags: [butler, butler-deploy]

- name: Grant Butler backend data access
  ansible.posix.acl:
    path: "{{ butler_data_dir }}"
    etype: user
    entity: root
    permissions: rwx
    recursive: true
    state: present
  tags: [butler-deploy]

- name: Create Butler checkout parents
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"
  loop:
    - "{{ butler_dir }}"
    - "{{ wiki_dir }}"
  tags: [butler-deploy]

- name: Create Butler SSH directory
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.ssh"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0700"
  tags: [butler-deploy]

- name: Trust GitHub SSH host key for Butler
  ansible.builtin.known_hosts:
    path: "/home/{{ agent_user }}/.ssh/known_hosts"
    name: github.com
    key: "{{ butler_github_known_host }}"
    state: present
  become_user: "{{ agent_user }}"
  tags: [butler-deploy]

- name: Check out Butler deployment ref
  ansible.builtin.git:
    repo: "{{ butler_repo_url }}"
    dest: "{{ butler_dir }}"
    version: "{{ butler_deploy_ref }}"
    update: true
  become_user: "{{ agent_user }}"
  register: butler_checkout
  tags: [butler-deploy]

- name: Check out Butler wiki
  ansible.builtin.git:
    repo: "{{ wiki_repo_url }}"
    dest: "{{ wiki_dir }}"
    update: true
  become_user: "{{ agent_user }}"
  tags: [butler-deploy]

- name: Check Butler wiki link
  ansible.builtin.stat:
    path: "{{ butler_data_dir }}/wiki"
  register: butler_wiki_link
  tags: [butler-deploy]

- name: Reject non-link Butler wiki path
  ansible.builtin.assert:
    that: not butler_wiki_link.stat.exists or butler_wiki_link.stat.islnk
    fail_msg: "{{ butler_data_dir }}/wiki exists and is not a symlink"
  tags: [butler-deploy]

- name: Link Butler wiki checkout
  ansible.builtin.file:
    src: "{{ wiki_dir }}"
    dest: "{{ butler_data_dir }}/wiki"
    state: link
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    force: true
  tags: [butler-deploy]

- name: Render Butler runtime environment
  ansible.builtin.command: "{{ infra_dir }}/scripts/dotenv-env.sh render"
  changed_when: false
  tags: [butler-deploy]

- name: Validate Butler runtime environment
  ansible.builtin.stat:
    path: "{{ butler_runtime_env }}"
  register: butler_runtime_env_file
  tags: [butler-deploy]

- name: Require regular Butler runtime environment
  ansible.builtin.assert:
    that:
      - butler_runtime_env_file.stat.exists
      - not butler_runtime_env_file.stat.islnk
  tags: [butler-deploy]

- name: Install Butler review queue helper
  ansible.builtin.file:
    path: "{{ butler_review_helper_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [butler-deploy]

- name: Link Butler review queue helper
  ansible.builtin.file:
    src: "{{ infra_dir }}/scripts/butler-review-queue.sh"
    dest: "{{ butler_review_helper }}"
    state: link
    owner: root
    group: root
    force: true
  tags: [butler-deploy]

- name: Read Butler Tailscale Serve configuration
  ansible.builtin.command: tailscale serve status
  register: butler_serve_status
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [butler-deploy]

- name: Configure Butler Tailscale Serve
  ansible.builtin.command: "tailscale serve --bg --https={{ butler_serve_port }} {{ butler_serve_target }}"
  when: >-
    butler_serve_status.rc != 0 or
    (':' ~ (butler_serve_port | string)) not in butler_serve_status.stdout or
    butler_serve_target not in butler_serve_status.stdout
  tags: [butler-deploy]

- name: Remove legacy Butler systemd units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/butler-backend.service
    - /etc/systemd/system/butler-frontend.service
    - /etc/systemd/system/multi-user.target.wants/butler-backend.service
    - /etc/systemd/system/multi-user.target.wants/butler-frontend.service
    - /etc/systemd/system/butler-backend.service.d/9router.conf
  register: butler_legacy_units
  tags: [butler-deploy]

- name: Remove empty Butler legacy unit directory
  ansible.builtin.command: rmdir /etc/systemd/system/butler-backend.service.d
  when: butler_legacy_units.changed
  changed_when: false
  failed_when: false
  tags: [butler-deploy]

- name: Reload systemd after legacy Butler removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: butler_legacy_units.changed
  tags: [butler-deploy]

- name: Create control-plane configuration directory
  ansible.builtin.file:
    path: "{{ control_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  tags: [butler-deploy]

# gitops-pull-apply runs as admin_user and must not need the root-only runtime env.
# Hand it only the keys the root docker-compose.yml (manifests/*) interpolates.
- name: Render GitOps stack env
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tmp=$(mktemp {{ control_dir | quote }}/.stack.env.XXXXXX)
      trap 'rm -f "$tmp"' EXIT
      { grep -E '^(BUTLER_[A-Z0-9_]+|API_SERVER_KEY|TAILSCALE_IP|NINEROUTER_[A-Z0-9_]+)=' {{ butler_runtime_env | quote }} || true
        printf 'WIKI_DIR=%s\nBUTLER_DIR=%s\n' {{ wiki_dir | quote }} {{ butler_dir | quote }}; } > "$tmp"
      chown {{ admin_user }}:{{ admin_user }} "$tmp"
      chmod 0600 "$tmp"
      mv -f "$tmp" {{ (control_dir ~ '/stack.env') | quote }}
      trap - EXIT
    executable: /bin/bash
  changed_when: false
  tags: [butler-deploy]

# GHCR_USERNAME + GHCR_PULL_TOKEN (classic PAT, read:packages only) come from the encrypted .env.
# Missing keys skip the login so an existing manual login keeps working. Token never leaves stdin.
- name: Log admin_user in to GHCR
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      env_file={{ butler_runtime_env | quote }}
      user=$(sed -n 's/^GHCR_USERNAME=//p' "$env_file")
      token=$(sed -n 's/^GHCR_PULL_TOKEN=//p' "$env_file")
      # dotenvx set stores values double-quoted; strip one surrounding pair.
      user=${user#\"}; user=${user%\"}; token=${token#\"}; token=${token%\"}
      if [ -z "$user" ] || [ -z "$token" ]; then echo SKIPPED; exit 0; fi
      printf '%s' "$token" | runuser -u {{ admin_user | quote }} -- \
        env DOCKER_CONFIG=/home/{{ admin_user }}/.docker docker login ghcr.io -u "$user" --password-stdin >/dev/null
      echo LOGGED_IN
    executable: /bin/bash
  register: butler_ghcr_login
  changed_when: "'LOGGED_IN' in butler_ghcr_login.stdout"
  no_log: true
  when: not ansible_check_mode
  tags: [butler-deploy]

- name: Warn when GHCR credentials are absent from the runtime environment
  ansible.builtin.debug:
    msg: >-
      GHCR_USERNAME/GHCR_PULL_TOKEN not set in the encrypted .env; keeping the existing
      docker login for {{ admin_user }}. Add them with dotenvx set (see README Secrets).
  when: not ansible_check_mode and 'SKIPPED' in butler_ghcr_login.stdout
  tags: [butler-deploy]

- name: Export Butler CLI from GHCR backend image
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      image=$(sed -n 's/^ *image: *\(ghcr.io\/william-dwe\/butler-backend@sha256:[a-f0-9]*\).*/\1/p' {{ (infra_dir ~ '/manifests/butler/compose.yml') | quote }})
      [ -n "$image" ]
      tmp=$(mktemp /usr/local/bin/.butler.XXXXXX)
      cid=
      trap 'rm -f "$tmp"; [ -z "$cid" ] || docker rm -f "$cid" >/dev/null' EXIT
      cid=$(docker create "$image")
      docker cp "$cid:/usr/local/bin/butler" "$tmp"
      chown root:root "$tmp"
      chmod 0755 "$tmp"
      mv -f "$tmp" /usr/local/bin/butler
      tmp=
    executable: /bin/bash
  environment:
    DOCKER_CONFIG: "/home/{{ admin_user }}/.docker"  # GHCR login lives with admin_user
  changed_when: false
  tags: [butler-deploy]

# Control-plane files used to live in /etc; they now live in control_dir. Removed last so a failed run keeps the old copies.
- name: Remove legacy /etc control-plane files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/personal-agent-infra.paths
    - /etc/butler-iac
    - /etc/personal-agent-infra.env
    - /etc/dotenvx
  tags: [butler-deploy]

# Cloudflare DNS as code. Token comes from the rendered runtime.env (never printed). Records stay DNS-only: 100.x is unreachable for Cloudflare's proxy.
- name: Read runtime environment
  ansible.builtin.slurp:
    src: "{{ runtime_env }}"
  register: dns_runtime_env
  no_log: true

- name: Extract Cloudflare API token
  ansible.builtin.set_fact:
    dns_cf_token: "{{ (dns_runtime_env.content | b64decode) | regex_search('(?m)^CLOUDFLARE_API_TOKEN=(.+)$', '\\1') | first | trim('\"') }}"
  no_log: true

- name: Read Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: dns_tailscale_ip
  changed_when: false
  check_mode: false

- name: Point wildcard at the Tailscale IP (private by default)
  community.general.cloudflare_dns:
    zone: "{{ dns_zone }}"
    record: "*"
    type: A
    value: "{{ dns_tailscale_ip.stdout | trim }}"
    proxied: false
    ttl: 300
    api_token: "{{ dns_cf_token }}"
  no_log: true

- name: Public records
  community.general.cloudflare_dns:
    zone: "{{ dns_zone }}"
    record: "{{ item.name }}"
    type: "{{ item.type | default('A') }}"
    value: "{{ item.value }}"
    proxied: "{{ item.proxied | default(false) }}"
    api_token: "{{ dns_cf_token }}"
  loop: "{{ dns_public_records }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
